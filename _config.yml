# GitHub Pages 설정
title: Taeyun Roh (노태윤) - AI Researcher
description: Research by Taeyun Roh on AI agent memory, GUI agents, multimodal reasoning, and language model systems.
url: https://txxnrd.github.io
baseurl: ""
repository: txxnrd/txxnrd.github.io

# SEO 관련 설정
author: 노태윤 (Taeyun Roh)
image: /img/taeyun.png

# Social Media
twitter:
  username: 
  card: summary_large_image

# 플러그인 (GitHub Pages에서 지원하는 것들)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 기본 설정
lang: en
timezone: Asia/Seoul

# Blog posts are rendered by GitHub Pages. Existing HTML pages stay static.
markdown: kramdown
highlighter: rouge
# Keep links tied to the immutable filename when a title or display date changes.
permalink: /blog/:path/
future: false
show_drafts: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: blog-post
      lang: en
      author: Taeyun Roh
      published: false

comments:
  enabled: true
  repo: txxnrd/txxnrd.github.io
  repo_id: R_kgDOJrp_uA
  category: Comments
  category_id: DIC_kwDOJrp_uM4DJXZG

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - BLOG_SETUP.md
  - scratch
  - output
  - tmp
  - remote_scripts
  - scripts
  - paper/artifacts
  - paper/experiments
  - paper/figures
