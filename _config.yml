# GitHub Pages 설정
title: 노태윤(Taeyun Roh) - AI Researcher
description: 고려대학교 DMIS 석사과정 학생으로 Large Language Models, Speculative Decoding, Information Retrieval을 연구합니다.
url: https://txxnrd.github.io
baseurl: ""
repository: txxnrd/txxnrd.github.io

# SEO 관련 설정
author: 노태윤 (Taeyun Roh)
image: /img/profile.jpg

# Social Media
twitter:
  username: 
  card: summary_large_image

# 플러그인 (GitHub Pages에서 지원하는 것들)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# 기본 설정
lang: ko-KR
timezone: Asia/Seoul

# Blog posts are rendered by GitHub Pages. Existing HTML pages stay static.
markdown: kramdown
highlighter: rouge
# Keep links tied to the immutable filename when a title or display date changes.
permalink: /blog/:path/
future: false
show_drafts: false
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: blog-post
      lang: en
      author: Taeyun Roh
      published: false

comments:
  enabled: false
  repo: txxnrd/txxnrd.github.io
  repo_id: ""
  category: Comments
  category_id: ""

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - BLOG_SETUP.md
  - scratch
  - output
  - tmp
  - remote_scripts
  - scripts
  - paper/artifacts
  - paper/experiments
  - paper/figures
