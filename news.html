    <script>
      function addNewsItem(
        containerId,
        localPath,
        imageLink,
        title,
        description,
        date,
        postLink = "",
      ) {
        const newsContainer = document.getElementById(containerId);
        const newsItem = document.createElement("article");
        newsItem.className = "news-card";

        const preview = document.createElement("div");
        preview.className = "news-card-media";
        const img = document.createElement("img");
        img.alt = title;
        img.loading = "lazy";
        img.decoding = "async";
        let triedFallback = false;
        img.addEventListener("error", () => {
          if (imageLink && !triedFallback) {
            triedFallback = true;
            img.src = imageLink;
          } else {
            preview.remove();
            newsItem.classList.add("news-card-without-image");
          }
        });
        if (localPath || imageLink) {
          img.src = localPath || imageLink;
          preview.appendChild(img);
        } else {
          newsItem.classList.add("news-card-without-image");
        }

        const newsContent = document.createElement("div");
        newsContent.className = "news-card-body";

        const newsDate = document.createElement("p");
        newsDate.className = "news-card-date";
        newsDate.textContent = date;

        const newsTitle = document.createElement("h2");
        newsTitle.textContent = title;

        const newsDescription = document.createElement("p");
        newsDescription.className = "news-card-text";
        newsDescription.textContent = description;

        newsContent.appendChild(newsDate);
        newsContent.appendChild(newsTitle);
        newsContent.appendChild(newsDescription);
        if (postLink) {
          const sourceLink = document.createElement("a");
          sourceLink.className = "text-link";
          sourceLink.href = postLink;
          sourceLink.target = "_blank";
          sourceLink.rel = "noopener noreferrer";
          sourceLink.textContent = "View announcement ↗";
          sourceLink.setAttribute("aria-label", `View announcement: ${title}`);
          newsContent.appendChild(sourceLink);
        }

        if (localPath || imageLink) newsItem.appendChild(preview);
        newsItem.appendChild(newsContent);
        newsContainer.appendChild(newsItem);
      }

      addNewsItem(
        "news-container",
        "./img/SRA.png",
