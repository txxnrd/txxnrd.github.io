    <script>
      const publications = [
        {
          title:
            "Learning How to Remember: Memory Modality Selection for GUI Agents",
          authors:
            "Taeyun Roh, Suhyeong Park, Gijin Kim, Wonjune Jang, Jaewoo Kang",
          venue: "arXiv preprint",
          venueClass: "arxiv",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2610.17928",
          projectLink: "/switchmem/",
          codeLink: "https://github.com/dmis-lab/SwitchMem",
          status: "Preprint",
          figure: "/switchmem/assets/framework.png",
          figureAlt: "SwitchMem framework for choosing text or visual memories for GUI agents",
          figureWidth: 1650,
          figureHeight: 780,
        },
        {
          title:
            "BUZZY: Contrastive Scoring to Mitigate Text-Induced Bias in Multimodal Multiple-Choice QA",
          authors:
            "Taeyun Roh, Suhyeong Park, Dongyoung Lee, Eunyeong Jo, Wonjune Jang, Junha Jung, Jaewoo Kang",
          venue: "arXiv preprint",
          venueClass: "arxiv",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2603.28026",
          projectLink: "/buzzy/",
          status: "Preprint",
          figure: "/img/publications/buzzy-framework.png",
          figureAlt: "BUZZY framework for contrastive scoring of multimodal multiple-choice answers",
          figureWidth: 1190,
          figureHeight: 467,
        },
        {
          title:
            "Breaking Failure Cascades: Step-Aware Reinforcement Learning for Medical Multimodal Reasoning",
          authors:
            "Junha Jung, Minbyul Jeong, Suhyeon Lim, Sungwook Jung, Jaehoon Yun, Taeyun Roh, Mujeen Sung, Jaewoo Kang",
          venue: "EMNLP 2026 Main",
          venueClass: "emnlp",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2606.31825",
          projectLink: "https://jungjunha.github.io/MRPO-page/",
          status: "Accepted",
          figure: "/img/publications/mrpo-overview.png",
          figureAlt: "MRPO framework with step-aware rewards for medical multimodal reasoning",
          figureWidth: 1170,
          figureHeight: 665,
        },
        {
          title:
            "Distilling Expert-level Planning for Real-world Diabetes Prescribing",
          authors:
            "Yein Park, Sihyeon Park, Taeyun Roh, Mujeen Sung, Jaehoon Yun, Sooyeon Lee, Sanghoon Lee, Jaewoo Kang",
          venue: "ICML 2026 Workshop SD4H",
          venueClass: "icml",
          year: 2026,
          pdfLink: "https://openreview.net/forum?id=WZvLoCILdg",
          status: "Accepted",
          figure: "/img/publications/diabetes-framework.png",
          figureAlt: "Expert planning distillation, search-augmented reinforcement learning, and clinical inference workflow for diabetes prescribing",
          figureWidth: 1310,
          figureHeight: 690,
        },
        {
          title:
            "CLAG: Adaptive Memory Organization via Agent-Driven Clustering for Small Language Model Agents",
          authors: "Taeyun Roh, Wonjune Jang, Junha Jung, Jaewoo Kang",
          venue: "ACL 2026 Findings",
          venueClass: "acl",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2603.15421",
          projectLink: "/CLAG/",
          status: "Published",
          figure: "/img/clag-framework.png",
          figureAlt: "CLAG framework for agent-driven clustering and adaptive memory organization",
          figureWidth: 1800,
          figureHeight: 900,
        },
      ];

      const domesticPublications = [
        {
          title:
            "Analysis on Research for Data and Resource Heterogeneity in Split-Federated Learning",
          authors:
            "Taeyun Roh, Seungwoo Jung, Yeonho Yoo, Sunjae Park, Gyeongsik Yang, Chuck Yoo",
          venue: "KIISE",
          venueClass: "kiise",
          year: 2024,
          pdfLink: "https://txxnrd.github.io/paper/splitfed.pdf",
          status: "Published",
          figure: "/img/publications/splitfed-comparison.png",
          figureAlt: "Comparison table of data and resource heterogeneity methods in split-federated learning",
          figureWidth: 668,
          figureHeight: 260,
        },
        {
          title: "Exploring the Secure Container for Permissioned Blockchains",
          authors:
            "Yunkyung Kang, Taeyun Roh, Junseok Lee, Wonmi Choi, Yeonho Yoo, Gyeongsik Yang, Chuck Yoo",
          venue: "KICS",
          venueClass: "kics",
          year: 2024,
          pdfLink: "https://txxnrd.github.io/paper/sec-container.pdf",
          status: "Published",
          figure: "/img/publications/secure-container.png",
          figureAlt: "Architecture comparison of virtual machines, native containers, and Kata containers",
          figureWidth: 860,
          figureHeight: 270,
        },
      ];

      function renderPublication(pub, container) {
        const item = document.createElement("article");
        item.className = "publication-card";

        const highlightedAuthors = pub.authors.replace(
          /Taeyun Roh/g,
          '<span class="author-highlight">Taeyun Roh</span>',
        );
        const publicationActions = [
          pub.pdfLink
            ? `<a class="publication-link" href="${pub.pdfLink}" target="_blank" rel="noreferrer">View Paper</a>`
            : "",
          pub.projectLink
            ? `<a class="publication-link" href="${pub.projectLink}">Project Page</a>`
            : "",
          pub.codeLink
            ? `<a class="publication-link" href="${pub.codeLink}" target="_blank" rel="noreferrer">GitHub</a>`
            : "",
        ]
          .filter(Boolean)
          .join("");

        item.innerHTML = `
        <div class="publication-header">
          <p class="publication-status">${pub.status}</p>
          <p class="publication-year">${pub.year}</p>
        </div>
        <div class="publication-copy">
          <h2>${pub.title}</h2>
          <p class="publication-authors">${highlightedAuthors}</p>
          <div class="publication-meta">
            <span class="publication-venue venue-${pub.venueClass}">${pub.venue}</span>
          </div>
          ${publicationActions ? `<div class="publication-actions">${publicationActions}</div>` : ``}
        </div>
        <a class="publication-figure" href="${pub.figure}" target="_blank" rel="noreferrer" aria-label="Enlarge figure: ${pub.title}">
          <img src="${pub.figure}" alt="${pub.figureAlt}" width="${pub.figureWidth}" height="${pub.figureHeight}" loading="lazy" decoding="async" />
          <span class="publication-figure-caption" aria-hidden="true">View figure ↗</span>
        </a>
      `;

        container.appendChild(item);
      }

      const container = document.getElementById("publication-list");
      const domesticContainer = document.getElementById(
        "domestic-publication-list",
      );

      publications.forEach((pub) => renderPublication(pub, container));
      domesticPublications.forEach((pub) =>
        renderPublication(pub, domesticContainer),
      );
    </script>
  </body>
</html>
