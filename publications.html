<!doctype html>
<html lang="ko">
  <head>
    <title>Publications | Taeyun Roh</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Publications and research manuscripts by Taeyun Roh."
    />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") === "night" ? "night" : "day";
    </script>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script defer src="theme.js"></script>
    <script src="https://cdn.amplitude.com/script/aadb0be7966e3e2574b459f6db28be6f.js"></script>
    <script>
      window.amplitude.init("aadb0be7966e3e2574b459f6db28be6f", {
        fetchRemoteConfig: true,
        autocapture: true,
      });
      amplitude.track("Publication");
    </script>
  </head>
  <body class="sub-page">
    <div class="page-shell">
      <header class="site-header">
        <a href="/index.html" class="site-logo">Taeyun Roh</a>
        <div class="site-header-actions">
          <nav class="site-nav" aria-label="Primary">
            <a href="/index.html">Home</a>
            <a href="/news.html">News</a>
            <a href="/publications.html" class="is-active">Publications</a>
          </nav>
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="밤 테마로 전환"
            aria-pressed="false"
            title="밤 모드"
          >
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <main class="sub-main">
        <section class="page-hero">
          <p class="eyebrow">Research Output</p>
          <h1>Publications</h1>
          <p class="page-intro">
            Selected papers and manuscripts related to machine learning systems
            and LLM-based agents.
          </p>
        </section>

        <section
          class="stack-list"
          id="publication-list"
          aria-label="Publication list"
        ></section>
      </main>
    </div>

    <script>
      const publications = [
        {
          title:
            "When Choices Become Priors: Contrastive Decoding for Scientific Figure Multiple-Choice QA",
          authors: "Taeyun Roh, Eun-yeong Jo, Wonjune Jang, Jaewoo Kang",
          venue: "Preprint",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2603.28026",
          status: "Under review",
        },
        {
          title:
            "Breaking Failure Cascades: Step-Aware Reinforcement Learning for Medical Multimodal Reasoning",
          authors:
            "Junha Jung, Minbyul Jeong, Suhyeon Lim, Sungwook Jung, Jaehoon Yun, Taeyun Roh, Mujeen Sung, Jaewoo Kang",
          venue: "Preprint",
          year: 2026,
          pdfLink: "",
          status: "Under review",
        },
        {
          title:
            "Distilling Expert-level Planning for Real-world Diabetes Prescribing",
          authors:
            "Yein Park, Sihyeon Park, Taeyun Roh, Mujeen Sung, Jaehoon Yun, Sooyeon Lee, Sanghoon Lee, Jaewoo Kang",
          venue: "ICML 2026 Workshop SD4H",
          year: 2026,
          pdfLink: "",
          status: "Accepted",
        },
        {
          title:
            "CLAG: Adaptive Memory Organization via Agent-Driven Clustering for Small Language Model Agents",
          authors: "Taeyun Roh, Wonjune Jang, Junha Jung, Jaewoo Kang",
          venue: "ACL 2026 findings",
          year: 2026,
          pdfLink: "https://arxiv.org/abs/2603.15421",
          projectLink: "/CLAG/",
          status: "Published",
        },
        {
          title:
            "Analysis on Research for Data and Resource Heterogeneity in Split-Federated Learning",
          authors:
            "Taeyun Roh, Seungwoo Jung, Yeonho Yoo, Sunjae Park, Gyeongsik Yang, Chuck Yoo",
          venue: "KIISE",
          year: 2024,
          pdfLink: "paper/splitfed.pdf",
          status: "Published",
        },
        {
          title: "Exploring the Secure Container for Permissioned Blockchains",
          authors:
            "Yunkyung Kang, Taeyun Roh, Junseok Lee, Wonmi Choi, Yeonho Yoo, Gyeongsik Yang, Chuck Yoo",
          venue: "KICS",
          year: 2024,
          pdfLink: "paper/sec-container.pdf",
          status: "Published",
        },
      ];

      const container = document.getElementById("publication-list");

      publications.forEach((pub) => {
        const item = document.createElement("article");
        item.className = "publication-card";

        const highlightedAuthors = pub.authors.replace(
          /Taeyun Roh/g,
          '<span class="author-highlight">Taeyun Roh</span>',
        );
        const publicationActions = [
          pub.pdfLink
            ? `<a class="publication-link" href="${pub.pdfLink}" target="_blank" rel="noreferrer">View Paper</a>`
            : "",
          pub.projectLink
            ? `<a class="publication-link" href="${pub.projectLink}">Project Page</a>`
            : "",
        ]
          .filter(Boolean)
          .join("");

        item.innerHTML = `
        <div class="publication-header">
          <p class="publication-status">${pub.status}</p>
          <p class="publication-year">${pub.year}</p>
        </div>
        <h2>${pub.title}</h2>
        <p class="publication-authors">${highlightedAuthors}</p>
        <div class="publication-meta">
          <span>${pub.venue}</span>
        </div>
        ${publicationActions ? `<div class="publication-actions">${publicationActions}</div>` : ``}
      `;

        container.appendChild(item);
      });
    </script>
  </body>
</html>
