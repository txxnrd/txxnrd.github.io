<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>Publications - txxnrd.github.io</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style>
      #blog-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 20px;
      }
      .underline {
        text-decoration: underline;
      }

      .blog-item {
        display: block;
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 5px;
        background-color: #ffffff;
      }

      .blog-item h3 {
        margin: 0;
        font-size: 1.5em;
      }

      .blog-item p {
        margin: 5px 0;
        line-height: 1.5;
      }

      .blog-item a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }

      .blog-item a:hover {
        text-decoration: underline;
      }
    </style>
    <script src="https://cdn.amplitude.com/script/aadb0be7966e3e2574b459f6db28be6f.js"></script>
    <script>
      window.amplitude.init("aadb0be7966e3e2574b459f6db28be6f", {
        fetchRemoteConfig: true,
        autocapture: true,
      });
    </script>
    <script>
      amplitude.track("Publication");
    </script>
  </head>
  <body>
    <header
      class="header"
      style="
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: #000;
      "
    >
      <!-- 1) 왼쪽 끝: 로고 -->
      <a href="/index.html" class="logo" style="color: #fff">
        txxnrd.github.io
      </a>

      <!-- 2) 오른쪽 영역을 하나의 div로 감싸고, margin-left:auto; 로 우측 정렬 -->
      <div
        style="display: flex; align-items: center; margin-left: auto; gap: 10px"
      >
        <!-- 체크박스: 햄버거 메뉴 토글 -->
        <input
          class="menu-btn"
          type="checkbox"
          id="menu-btn"
          style="display: none"
        />

        <!-- 언어 토글 버튼 -->
        <button
          id="langToggle"
          style="background: none; border: none; cursor: pointer"
        >
          <img
            id="langToggleImg"
            src="img/world.png"
            alt="Toggle Language"
            style="width: 20px; height: 20px"
          />
        </button>

        <!-- 햄버거 아이콘 (label) -->
        <label class="menu-icon" for="menu-btn" style="cursor: pointer">
          <span class="navicon"></span>
        </label>

        <!-- 실제 메뉴 -->
        <ul class="menu" style="margin: 0; padding: 0; list-style: none">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/news.html">News</a></li>
          <li><a href="/publications.html">Publications</a></li>
          <li><a href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </header>

    <main>
      <div class="news-title">Publications</div>
      <div id="blog-container"></div>
    </main>

    <script>
      // 데이터 입력 (여기서 제목, 저자, 컨퍼런스명, 연도 설정)
      const publications = [
        {
          title:
            "Analysis on Research for Data and Resource Heterogeneity in Split-federated Learning",
          authors:
            "Taeyun Roh, Seungwoo Jung, Yeonho Yoo, Sunjae Park, Gyeongsik Yang, Chuck Yoo",
          conference: "한국정보과학회",
          year: 2024,
          pdfLink: "paper/splitfed.pdf",
        },
        {
          title: "Exploring the Secure Container for Permissioned Blockchains",
          authors:
            "Yunkyung Kang, Taeyun Roh, Junseok Lee, Wonmi Choi, Yeonho Yoo, Gyeongsik Yang, & Chuck Yoo ",
          conference: "한국통신학회",
          year: 2024,
          pdfLink: "paper/sec-container.pdf",
        },
      ];

      // HTML 생성
      const container = document.getElementById("blog-container");

      publications.forEach((pub) => {
        const item = document.createElement("div");
        item.classList.add("blog-item");

        // 'Taeyun Roh' 부분만 밑줄 처리
        const highlightedAuthors = pub.authors.replace(
          /Taeyun Roh/g,
          '<span class="underline">Taeyun Roh</span>'
        );

        item.innerHTML = `
          <h3>${pub.title}</h3>
          <p>Authors: ${highlightedAuthors}</p>
          <p>Conference: ${pub.conference}</p>
          <p>Year: ${pub.year}</p>
          <p>
            ${
              pub.pdfLink
                ? `<a href="${pub.pdfLink}" style="color: #007bff; text-decoration: none; font-weight: bold">[pdf]</a>`
                : ""
            }
          </p>
        `;
        container.appendChild(item);
      });
    </script>
  </body>
</html>
